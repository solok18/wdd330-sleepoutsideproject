<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/productDetails.js"></script>
  </head>
  <body>
    <header id = "main-header" class="divider"></header>

    <main class="divider">
      <section class="product-detail">
        <div class="product__image"><img id="productImage" alt="" /></div>
        <div class="product__info">
          <h1 id="productName" class="product__name"></h1>
          <p id="productColor" class="product__color"></p>
          <p id="productPrice" class="product__price"></p>
          <button id="addToCart">Add to Cart</button>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
