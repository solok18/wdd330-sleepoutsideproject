<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="divider"></header>

    <main class="divider checkout">
      <h2>Review & Place your Order</h2>
      <section class="checkout-form">
        <form action="checkout">
          <fieldset>
            <legend></legend>
            <div class="checkout-name">
              <label>First Name*</label>
              <input type="text" name="fname" id="fname" required>
              <label>Last Name*</label>
              <input type="text" name="lname" id="lname" required>
            </div>

            <div class="checkout-address">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" required>
              <label for="address-line-2">Apartment, suite, etc. (optional)</label>
              <input type="text" id="address-line-2" name="address-line-2">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required>
              <label for="state">State / Province</label>
              <input type="text" id="state" name="state" required>
              <label for="zip">ZIP</label>
              <input type="text" id="zip" name="zip" required>
            </div>
          </fieldset>
          <fieldset>
            <div class="payment">
              <label for="cardNumber">Card Number:</label>
              <input type="text" id="cardNumber" name="cardNumber" required>
              <label for="expDate">Expiration Date:</label>
              <input type="text" id="expDate" name="expDate" required>
              <label for="cvv">CVV:</label>
              <input type="text" id="cvv" name="cvv" required>
            </div>
          </fieldset>
            
            <legend>Order Summary</legend>

            <div class="order_summary">
              <div>Items</div>
              <div id="numberItems"></div>
              <div>Subtotal</div>
              <div id="cartTotal"></div>
              <div>Shipping</div>
              <div>Tax</div>
              <div id="tax"></div>
              <div id="shipping"></div>
              <div>Total</div>
              <div id="total"></div>
            </div>
          <button type="submit" id="checkoutSubmit"></button>
    
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
